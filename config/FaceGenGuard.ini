; FaceGenGuard - Data/SKSE/Plugins/FaceGenGuard.ini
; Every value here is the compiled-in default; delete the file to use them.

[Resilience]
; Survive ONE known crash instead of dying. On an access violation whose RIP
; falls inside the whitelisted code range, the guard unwinds the faulting
; function to its caller, sets RAX=0 there and continues execution.
;
; OFF by default, and the plugin installs NOTHING when this is 0. This feature
; CHANGES GAME SEMANTICS: the faulting call's half-done side effects are
; abandoned, and RAX=0 is only a safe return for scalar, pointer and bool
; returns (NOT for struct-by-value returns). When it is on, the startup log
; prints "behaviourChanging=resilience-guard" so you can always see that this
; run was not semantics-preserving.
bEnabled=0
; Fail-open cap: after this many suppressions the guard stops suppressing and
; lets the crash happen, so one known crash cannot become an unknown corrupted
; state that keeps running. The running total and the cap are printed every
; 60 s in FaceGenGuard.log; every suppression is also written to
; FaceGenGuard-resilience.log (allocation-free, one fixed-format line).
uMaxSuppressions=64
; OPTIONAL whitelist override, EMPTY by default. Empty = the built-in target:
; the engine function at Address Library ID 26938, whose scope is computed at
; runtime as [entry, entry+0x800). This is the crash the guard exists for
; (Skyrim AE 1.7.104.0); the guard verifies the function's prologue before
; installing and refuses to run on a build it does not recognise.
;
; A non-empty value replaces the built-in target with exactly these hex RVA
; ranges ("0xAAAAAA-0xBBBBBB, 0xCCCCCC-0xDDDDDD", end exclusive, RVAs relative
; to SkyrimSE.exe). Only set this if you have verified the function scope in
; YOUR game build; a wrong range means the guard may catch faults in code it
; was never designed for.
sRvaWhitelist=
