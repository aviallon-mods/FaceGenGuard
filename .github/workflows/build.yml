name: build

# FaceGenGuard: the off-game test suite runs on Linux AND Windows (the handler's
# decision core is plain C++, and two toolchains is what makes the claim
# cross-compiler rather than single-compiler), and the DLL is cross-built on
# Linux with the proven Mantella-AE104 toolchain (xwin + vcpkg + clang-cl,
# CommonLibSSE-NG v6.8.0 - the only revision whose address-library reader can
# parse the 1.7.104 versionlib bins).
#
# Everything from the build onwards -- the FOMOD zip assembled from
# fomod-package.toml, the mutation-tested verify gate, artifacts, the tag
# release and the rolling `ci` prerelease -- belongs to the shared pipeline
# aviallon-mods/modforge/.github/workflows/build-fomod.yml@main. The cross
# build itself runs inside that job (setup_command/build_command plus the same
# toolchain cache as before), so nothing ships that the gate has not seen and
# the build is not run twice.

on:
  push:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  tests:
    name: off-game tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build the test binary
        shell: bash
        run: cmake --build build-tests --config Release

      - name: Run the off-game suite
        shell: bash
        run: |
          set -euo pipefail
          if [ -x build-tests/fgtests ]; then
            BIN=build-tests/fgtests
          else
            BIN=build-tests/Release/fgtests.exe
          fi
          "$BIN" 2>&1 | tee tests.out

          # A green run is only meaningful if it actually ran something: zero
          # failures AND a non-trivial number of checks. A runner that silently
          # ran no tests would otherwise look exactly like success.
          grep -qE '0 failure\(s\)' tests.out || { echo "::error::the suite reported failures"; exit 1; }
          checks=$(sed -nE 's/.*[0-9]+ test\(s\) run, ([0-9]+) check\(s\).*/\1/p' tests.out | tail -1)
          echo "checks executed: ${checks:-<none>}"
          test -n "$checks" || { echo "::error::could not read the check count"; exit 1; }
          test "$checks" -gt 150 || { echo "::error::only $checks checks ran - the suite did not really execute"; exit 1; }

  # Build + package + verify + upload + release, delegated to the shared
  # pipeline. It checks out this repo and aviallon-mods/modforge, restores the
  # cross-toolchain cache, runs the two commands below, then assembles the zip
  # from fomod-package.toml and refuses to upload it unless
  # modforge/tools/verify_fomod.py passes (exact entry list, >= 1 <plugin> in
  # the ModuleConfig, payload byte-identity, stamped meta.ini). See
  # research/fomod-packaging-verification.md for the mutation evidence behind
  # the >= 1 <plugin> rule.
  package:
    name: package + verify + release
    # The FOMOD must not ship past a red suite.
    needs: tests
    permissions:
      contents: write
    uses: aviallon-mods/modforge/.github/workflows/build-fomod.yml@main
    with:
      mod_name: FaceGenGuard
      # The reusable workflow runs commands, not actions, so Nix (which
      # cachix/install-nix-action used to provide) is bootstrapped here from
      # the official installer: daemon install, non-interactive in CI (stdin is
      # not a TTY; NIX_INSTALLER_YES=1 covers the rest).
      install_nix: true
      setup_command: |
        set -euo pipefail
        # Nix itself comes from DeterminateSystems/nix-installer-action
        # (install_nix: true), which puts it on PATH the supported way.
        command -v nix
        tools/setup-toolchain.sh
      # WORK=$PWD/build so tools/build.sh's own verified output (after its
      # feature-string and verify-dll.py gates) lands at the repo-relative path
      # fomod-package.toml packages: build/out/FaceGenGuard.dll. It is uploaded
      # raw as the extra artifact, exactly like before.
      build_command: |
        set -euo pipefail
        WORK="$PWD/build" tools/build.sh
      # The toolchain pieces are immutable and expensive (the xwin sysroot is
      # the Windows SDK, llvm-mingw is ~1.5 GB, the vcpkg binary cache holds
      # every dependency build). setup-toolchain.sh is idempotent and skips
      # whatever the cache restored.
      cache_paths: |
        ~/.local/share/llvm-mingw
        ~/.local/share/vcpkg
        ~/.cache/vcpkg-binaries
        /tmp/xwin-winsysroot
        /tmp/xwin-cache
        /tmp/clng
      # A reusable workflow call's `with:` allows neither the runner context
      # nor hashFiles, so the OS is spelled out: this is the exact string the
      # old cache step produced as `fg-toolchain-v1-${{ runner.os }}` on
      # ubuntu-latest, keeping the warm cache across this reshape. Bump the
      # suffix when tools/setup-toolchain.sh pins change.
      cache_key: fg-toolchain-v1-Linux
      extra_artifact: build/out/FaceGenGuard.dll
