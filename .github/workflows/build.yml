name: build

# FaceGenGuard: the off-game test suite runs on Linux AND Windows (the handler's
# decision core is plain C++, and two toolchains is what makes the claim
# cross-compiler rather than single-compiler), and the DLL is cross-built on
# Linux with the proven Mantella-AE104 toolchain (xwin + vcpkg + clang-cl,
# CommonLibSSE-NG v6.8.0 - the only revision whose address-library reader can
# parse the 1.7.104 versionlib bins).

on:
  push:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  tests:
    name: off-game tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build the test binary
        shell: bash
        run: cmake --build build-tests --config Release

      - name: Run the off-game suite
        shell: bash
        run: |
          set -euo pipefail
          if [ -x build-tests/fgtests ]; then
            BIN=build-tests/fgtests
          else
            BIN=build-tests/Release/fgtests.exe
          fi
          "$BIN" 2>&1 | tee tests.out

          # A green run is only meaningful if it actually ran something: zero
          # failures AND a non-trivial number of checks. A runner that silently
          # ran no tests would otherwise look exactly like success.
          grep -qE '0 failure\(s\)' tests.out || { echo "::error::the suite reported failures"; exit 1; }
          checks=$(sed -nE 's/.*[0-9]+ test\(s\) run, ([0-9]+) check\(s\).*/\1/p' tests.out | tail -1)
          echo "checks executed: ${checks:-<none>}"
          test -n "$checks" || { echo "::error::could not read the check count"; exit 1; }
          test "$checks" -gt 150 || { echo "::error::only $checks checks ran - the suite did not really execute"; exit 1; }

  build:
    name: FaceGenGuard.dll (linux -> MSVC ABI via xwin + vcpkg + clang-cl)
    runs-on: ubuntu-latest
    # contents:write is for the tag-time release attach (softprops/action-gh-release).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # The toolchain pieces are immutable and expensive (the xwin sysroot is
      # the Windows SDK, llvm-mingw is ~1.5 GB, the vcpkg binary cache holds
      # every dependency build). Cache them together; setup-toolchain.sh is
      # idempotent and skips whatever the cache restored.
      - name: Cache the cross toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/llvm-mingw
            ~/.local/share/vcpkg
            ~/.cache/vcpkg-binaries
            /tmp/xwin-winsysroot
            /tmp/xwin-cache
            /tmp/clng
          key: fg-toolchain-v1-${{ runner.os }}

      - name: Set up the toolchain (idempotent)
        run: tools/setup-toolchain.sh

      - name: Cross-build FaceGenGuard.dll
        run: tools/build.sh

      # The installable FOMOD zip is assembled here, from the DLL just built and
      # the two VERSIONED packaging sources (fomod/ModuleConfig.xml,
      # config/FaceGenGuard.ini) -- then VERIFIED before anything uploads it.
      # tools/verify-fomod.py is a real, mutation-tested gate: a well-formed
      # ModuleConfig.xml whose <optionalFileGroups> yields ZERO <plugin> (e.g.
      # <optionalFileGroups/>) makes Amethyst's wizard resolve
      # `selected_plugin or first_plugin` to None and die with AttributeError on
      # .description, and such a zip turns this job red. See
      # research/fomod-packaging-verification.md for the mutation evidence.
      - name: Package the FOMOD zip
        run: tools/package-fomod.sh /tmp/facegenguard-build/out/FaceGenGuard.dll

      - name: Verify the FOMOD package (gate)
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(FaceGenGuard-*-fomod.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::expected exactly one fomod zip, found ${#zips[@]}: ${zips[*]:-none}"
            exit 1
          fi
          python3 tools/verify-fomod.py "${zips[0]}" /tmp/facegenguard-build/out/FaceGenGuard.dll

      - uses: actions/upload-artifact@v4
        with:
          name: FaceGenGuard
          path: /tmp/facegenguard-build/out/FaceGenGuard.dll

      - uses: actions/upload-artifact@v4
        with:
          name: FaceGenGuard-FOMOD
          path: FaceGenGuard-*-fomod.zip

      # Release convention (the same one the sibling SKSE repos use): a pushed
      # tag attaches the VERIFIED installable zip to that tag's GitHub release.
      - name: Attach the FOMOD zip to a release when tagging
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FaceGenGuard-*-fomod.zip
          body: |
            FaceGenGuard FOMOD for SKSE (Skyrim SE/AE 1.7.104, Address Library V5).

            An SKSE plugin that survives one known RaceMenu face-gen crash instead
            of dying. Behaviour-changing and opt-in: see SKSE/Plugins/FaceGenGuard.ini
            ([Resilience] bEnabled).

            Install with Amethyst: Mods -> Install mod from file...
            The zip was assembled AND shape-verified by CI (tools/verify-fomod.py:
            exact 3-entry layout, a ModuleConfig.xml that yields at least one
            <plugin>, a <pattern> copying SKSE, a [Resilience] bEnabled key, and
            the DLL byte-identical to the CI build).
